search = sourcetype="powershell:transcript" "-noe*"
#tags noexit

# -Command and its abbreviations. Spelled out so -ComputerName, -ComObject and the like
# don't match ("-co" is ambiguous in PowerShell, so it can't mean -Command). The terms find
# candidates fast; command_switch (props.conf) then requires the switch on a line that runs
# powershell or pwsh, which drops Invoke-Command, Get-Command, python -c and bash -c
# (unless the line names PowerShell too, e.g. a prompt in a WindowsPowerShell folder).
[powershell_command]
search = sourcetype="powershell:transcript" ("-c" OR "-com" OR "-comm" OR "-comma" OR "-comman" OR "-command") command_switch=true
#tags command

