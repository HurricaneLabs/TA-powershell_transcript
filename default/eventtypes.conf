[powershell_event]
search = sourcetype="powershell:transcript"
#tags powershell

# Events that hold a whole session header, so they describe one PowerShell launch. Leaves
# out the header-less tail of a session that went idle past the forwarder's
# time_before_close, and -UseMinimalHeader sessions. Untagged; README.md shows how to tag it
# into the CIM Endpoint data model.
[powershell_transcript_session]
search = sourcetype="powershell:transcript" pid=*

### Potentially Interesting PowerShell ###
# Reference: https://unit42.paloaltonetworks.com/unit42-pulling-back-the-curtains-on-encodedcommand-powershell-attacks/
# -EncodedCommand, its -ec alias, and every abbreviation PowerShell accepts (-e up to
# -encodedcommand), with "-" or "/".
# The terms find candidates fast; encoded_command_switch (props.conf) then requires a
# payload after the switch shaped like base64 of UTF-16LE text, which drops -Encoding
# abbreviations, docker -e, git -e, sed -e, xcopy /e, robocopy /e and the like.
[powershell_encoded_command]
search = sourcetype="powershell:transcript" ("-e" OR "-ec" OR "-en" OR "-enc" OR "-enco" OR "-encod" OR "-encode" OR "-encoded" OR "-encodedc" OR "-encodedco" OR "-encodedcom" OR "-encodedcomm" OR "-encodedcomma" OR "-encodedcomman" OR "-encodedcommand" OR "/e" OR "/ec" OR "/en" OR "/enc" OR "/enco" OR "/encod" OR "/encode" OR "/encoded" OR "/encodedc" OR "/encodedco" OR "/encodedcom" OR "/encodedcomm" OR "/encodedcomma" OR "/encodedcomman" OR "/encodedcommand") encoded_command_switch=true
#tags encoded_command

