[powershell:transcript]
# PowerShell translates the banner and header labels into the Windows display language
# (Windows PowerShell 5.1, and PowerShell 7.6.6 and later), so everything here keys on the
# header's layout, which is the same in every language, instead of on English words.
# The one fixed word is the product name: the banner line must contain "PowerShell" (never
# translated) and no ">", so command output can't pose as a header; prompt lines
# ("PS C:\Windows\System32\WindowsPowerShell\v1.0> ...") always contain ">".
#   **********************                      <- 22 asterisks
#   Windows PowerShell transcript start         <- banner ("PowerShell ..." in 7.x)
#   Start time: 20261105093000                  <- label, colon, yyyyMMddHHmmss
#   Username: CORP\jsmith
#   RunAs User: CORP\jsmith
#   Configuration Name:                         <- missing in some older 5.1 builds
#   Machine: WS01 (Microsoft Windows NT 10.0.19045.0)
#   Host Application: C:\...\powershell.exe -nop
#   Process ID: 4242
#   PSVersion: 5.1.19041.4291                   <- version keys are never translated
#   ...
#   **********************
# The end block has the same first three lines ("... transcript end" / "End time: ...")
# followed by the asterisk line. Per-command "Command start time" blocks have no banner
# line, so they never match, and neither does a prompt line followed by output shaped
# like "label: yyyyMMddHHmmss". Lines end in CRLF on Windows, LF elsewhere.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n
BREAK_ONLY_BEFORE_DATE = false
LINE_BREAKER_LOOKBEHIND = 50000
NO_BINARY_CHECK = true
TIME_FORMAT = %Y%m%d%H%M%S
# The first "label: yyyyMMddHHmmss" line: the start time in a session, or the first
# "Command start time" in the header-less tail of a session that went idle.
TIME_PREFIX = (?m)^[^\d\r\n*]*:[ \t]*(?=\d{14}\r?$)
MAX_TIMESTAMP_LOOKAHEAD = 14
TRUNCATE = 262144
TRANSFORMS-discard-transcript_end = setnull_transcript_end

# Header lines by position, counted from the asterisk line, banner and start time. A
# skipped line can't be an asterisk line, so a -UseMinimalHeader session (its header
# closes right after the start time) gets none of these from its commands' output.
# Username and RunAs User are DOMAIN\name. Names can hold dots, spaces and $ (machine
# accounts), and the domain can hold spaces (NT AUTHORITY\SYSTEM).
EXTRACT-user = (?m)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n[^\r\n:]+:[ \t]*(?:(?<domain>[^\\\r\n]+)\\)?(?<user>[^\r\n]+?)[ \t]*\r?$
EXTRACT-runasuser = (?m)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n[^*\r\n][^\r\n]*\r?\n[^\r\n:]+:[ \t]*(?:(?<runas_domain>[^\\\r\n]+)\\)?(?<runas_user>[^\r\n]+?)[ \t]*\r?$
EXTRACT-username = (?m)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n[^\r\n:]+:[ \t]*(?<username>[^\r\n]+?)[ \t]*\r?$
# "NAME (OS version)", after the user lines and the optional configuration name line.
# zh-Hant writes no space before the parenthesis.
EXTRACT-machine = (?m)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n(?:[^*\r\n][^\r\n]*\r?\n){2,3}?[^\r\n:]+:[ \t]*(?<computer>[^\s(]+)[ \t]?\((?<os_ver>[^\r\n]+)\)[ \t]*\r?$
# The line after the machine line. Only its first line if the command line spans several.
EXTRACT-app = (?m)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n(?:[^*\r\n][^\r\n]*\r?\n){2,3}?[^\r\n:]+:[ \t]*[^\s(]+[ \t]?\([^\r\n]+\)[ \t]*\r?\n[^\r\n:]+:[ \t]*(?<app>[^\r\n]+?)[ \t]*\r?$
# Executable from the launch command line. PowerShell drops the quotes when it rejoins the
# arguments, so an unquoted drive or UNC path runs to the first .exe/.dll (it may contain
# spaces, e.g. C:\Program Files\PowerShell\7\pwsh.dll) that comes before the first switch
# (" -x" or " /x"); anything else, including a path typed without .exe, is its first word.
EXTRACT-process_path = (?m)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n(?:[^*\r\n][^\r\n]*\r?\n){2,3}?[^\r\n:]+:[ \t]*[^\s(]+[ \t]?\([^\r\n]+\)[ \t]*\r?\n[^\r\n:]+:[ \t]*"?(?<process_path>[A-Za-z]:\\(?:(?!\s[-/]\w)[^"\r\n])*?\.(?i:exe|dll)(?=[\s"]|$)|\\\\(?:(?!\s[-/]\w)[^"\r\n])*?\.(?i:exe|dll)(?=[\s"]|$)|[^"\s]+)
# The line just before the (English) PSVersion key
EXTRACT-pid = (?m)^[^\r\n:]+:[ \t]*(?<pid>\d+)[ \t]*\r?\nPSVersion:
EXTRACT-version = (?m)(?:PSVersion: )(?<PSVersion>[\d\.]+)
EXTRACT-edition = (?m)(?:PSEdition: )(?<PSEdition>[\w]+)
EXTRACT-compatible = (?m)^(?:PSCompatibleVersions: )(?<PSCompatible>[0-9\.,\s]+)
EXTRACT-build = (?m)(?:BuildVersion: )(?<build>[\d\.]+)
EXTRACT-CLR = (?m)(?:CLRVersion: )(?<CLR>[0-9\.]+)
EXTRACT-WSMan = (?m)(?:WSManStackVersion: )(?<WSMan>[\d\.]+)
EXTRACT-protocol = (?m)(?:PSRemotingProtocolVersion: )(?<protocol>[\d\.]+)
EXTRACT-serialization = (?m)(?:SerializationVersion: )(?<serialization>[\d\.]+)
# Everything after the header's closing asterisk line. Keyed on the header's end rather
# than its last key, because PowerShell 7 orders the version keys differently.
EXTRACT-std_out = (?s)\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\r?\n(?:[^\r\n]*\r?\n)*?\*{20,}\r?\n(?<std_out>.+)
EXTRACT-end_time = (?m)(?:End time: )(?<end_time>\d+)
EVAL-end_time = strptime(end_time,"%Y%m%d%H%M%S")

FIELDALIAS-dvc = computer as dvc

# Flags for the powershell_command and powershell_encoded_command eventtypes, whose raw
# terms alone can't tell a PowerShell switch from look-alikes.
# command_switch: -Command (or -c, -com ... -comman) as its own word on a line that runs
# powershell or pwsh. Not Invoke-Command / Get-Command, not python -c or bash -c, unless
# the line names PowerShell too (a WindowsPowerShell prompt path, a script's -c after -File).
EVAL-command_switch = if(match(_raw, "(?im)(?:powershell|pwsh)[^\\r\\n]*?\\s-(?:c|com|comm|comma|comman|command)\\s"), "true", null())
# encoded_command_switch: -EncodedCommand or an abbreviation (-e, -ec, -enc ...) as its own
# word, then spaces, quotes or commas (so -ArgumentList '-enc','...' counts), then a payload
# that starts like base64 of UTF-16LE text, the only thing -EncodedCommand accepts. That
# shape is checked case-sensitively and works wherever the switch is, so a renamed or
# obfuscated powershell still counts. Not Out-File -enc utf8NoBOM, sed -e '...', git grep -e,
# docker run -e HOSTNAME or [ -e /path ]. Misses commands of only one or two characters.
EVAL-encoded_command_switch = if(match(_raw, "(?i)(?<![\\w-])[-/](?:e|ec|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)[\\s'\",]+(?-i:[A-Za-z0-9+/][AQgw][AB][A-Za-z0-9+/]A[A-H][AEIMQUYcgkosw048]A)"), "true", null())

EVAL-vendor = "Microsoft"
EVAL-vendor_product = "PowerShell Transcript"

# CIM Endpoint.Processes field names. The events aren't tagged into the data model by
# default; README.md shows how to add the tags. Each transcript is one PowerShell session,
# so "Host Application" is the launch command line of that process.
FIELDALIAS-cim_process = computer AS dest app AS process pid AS process_id
EVAL-action = if(isnotnull(pid), "allowed", null())
# Bare file name of process_path. PowerShell 7 reports its host as pwsh.dll (a .NET
# quirk); the running process is pwsh.exe, which is the name CIM content searches for.
# A bare "powershell" launch gets its .exe back.
EVAL-process_name = replace(replace(replace(process_path, "^.*[\\\\/]", ""), "(?i)^pwsh\\.dll$", "pwsh.exe"), "^([^.]+)$", "\\1.exe")
