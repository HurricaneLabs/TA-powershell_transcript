# An end block is an event of exactly four lines: asterisks, banner, "label: time",
# asterisks. Keyed on layout, since the banner is translated, plus the product name: the
# banner must contain "PowerShell" (never translated) and no ">", so command output shaped
# like an end block is not dropped. An empty -UseMinimalHeader
# session (no commands at all) has the same shape and is dropped too.
[setnull_transcript_end]
REGEX = \A\*{20,}\r?\n(?=[^*\r\n])[^\r\n>]*(?i:powershell)[^\r\n>]*\r?\n[^\d\r\n*]*:[ \t]*\d{14}\s*\*{20,}\s*\z
DEST_KEY = queue
FORMAT = nullQueue
